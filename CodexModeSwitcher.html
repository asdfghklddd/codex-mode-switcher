<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Codex Mode Switcher</title>
  <style>
    :root {
      --paper: #f5f1e7;
      --ink: #172421;
      --muted: #61706a;
      --line: #c9d0c4;
      --green: #0c6b54;
      --green-deep: #07523f;
      --orange: #e35e37;
      --orange-soft: #fff0e8;
      --card: #fffdf8;
      --shadow: 0 20px 55px rgba(25, 49, 40, .12);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(12, 107, 84, .055) 1px, transparent 1px) 0 0 / 36px 36px,
        linear-gradient(rgba(12, 107, 84, .055) 1px, transparent 1px) 0 0 / 36px 36px,
        var(--paper);
      font-family: "Aptos", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(28px, 6vw, 76px) 0 44px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      padding-bottom: 22px;
      border-bottom: 2px solid var(--ink);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--green);
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", "Noto Serif SC", serif;
      font-size: clamp(38px, 7vw, 66px);
      font-weight: 700;
      letter-spacing: -.06em;
      line-height: .94;
    }

    .local-lock {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--green-deep);
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      white-space: nowrap;
    }

    .lock-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(12, 107, 84, .12);
    }

    .status {
      display: grid;
      grid-template-columns: 1.1fr .9fr .7fr;
      gap: 1px;
      margin-top: 28px;
      border: 1px solid var(--line);
      background: var(--line);
      box-shadow: var(--shadow);
    }

    .status-item {
      min-width: 0;
      padding: 17px 18px;
      background: var(--card);
    }

    .label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .value {
      display: block;
      overflow: hidden;
      font-size: 16px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 28px;
    }

    .mode {
      position: relative;
      min-height: 220px;
      padding: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: inherit;
      background: var(--card);
      box-shadow: 0 8px 0 rgba(23, 36, 33, .05);
      cursor: pointer;
      text-align: left;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .mode::after {
      position: absolute;
      right: -32px;
      bottom: -52px;
      width: 130px;
      height: 130px;
      border: 20px solid currentColor;
      border-radius: 50%;
      content: "";
      opacity: .07;
    }

    .mode:hover, .mode:focus-visible {
      z-index: 1;
      border-color: var(--green);
      box-shadow: 0 13px 0 rgba(12, 107, 84, .12);
      outline: none;
      transform: translateY(-5px);
    }

    .mode:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
    .mode[disabled] { cursor: wait; opacity: .62; transform: none; }

    .mode-number {
      color: var(--orange);
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .mode h2 { margin: 32px 0 8px; font-size: 26px; letter-spacing: -.035em; }
    .mode p { max-width: 220px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .mode code { position: absolute; bottom: 21px; color: var(--green-deep); font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; font-size: 12px; }

    .notice {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 12px;
      margin-top: 26px;
      padding: 16px 18px;
      border-left: 4px solid var(--orange);
      background: var(--orange-soft);
      color: #7b3520;
      font-size: 14px;
      line-height: 1.55;
    }

    .notice strong { color: #562315; }
    .notice-mark { font-family: Georgia, serif; font-size: 24px; font-weight: 700; line-height: 1; }

    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
      justify-content: space-between;
      margin-top: 26px;
      color: var(--muted);
      font-size: 13px;
    }

    #message { min-height: 20px; margin: 0; }
    #message.error { color: #a93218; }
    #message.success { color: var(--green-deep); }

    .quiet-button {
      padding: 7px 0;
      border: 0;
      border-bottom: 1px solid currentColor;
      color: inherit;
      background: transparent;
      cursor: pointer;
      font: inherit;
    }

    @media (max-width: 680px) {
      header, .status { grid-template-columns: 1fr; }
      .local-lock { margin-top: 10px; }
      .modes { grid-template-columns: 1fr; }
      .mode { min-height: 175px; }
      .mode h2 { margin-top: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">configuration control / local only</p>
        <h1>Codex<br>Mode Switcher</h1>
      </div>
      <div class="local-lock"><span class="lock-dot"></span>127.0.0.1 only</div>
    </header>

    <section class="status" aria-label="当前配置">
      <div class="status-item"><span class="label">active provider</span><strong class="value" id="provider">读取中…</strong></div>
      <div class="status-item"><span class="label">active model</span><strong class="value" id="model">读取中…</strong></div>
      <div class="status-item"><span class="label">config home</span><strong class="value" id="home">读取中…</strong></div>
    </section>

    <section class="modes" aria-label="切换模式">
      <button class="mode" type="button" data-mode="Normal" data-name="Normal">
        <span class="mode-number">01 / NORMAL</span><h2>OpenAI 默认</h2><p>移除顶层指定 provider，回到正常 OpenAI 登录配置。</p><code>OpenAI default</code>
      </button>
      <button class="mode" type="button" data-mode="Cockpit" data-name="Cockpit">
        <span class="mode-number">02 / COCKPIT</span><h2>Cockpit</h2><p>选择本机已配置的 Cockpit provider。</p><code>codex_local_access</code>
      </button>
      <button class="mode" type="button" data-mode="CCSwitch" data-name="CCSwitch">
        <span class="mode-number">03 / CC SWITCH</span><h2>CCSwitch</h2><p>选择本机已配置的 custom provider。</p><code>custom</code>
      </button>
    </section>

    <aside class="notice">
      <div class="notice-mark">!</div>
      <div><strong>会话安全锁定。</strong>此面板只修改 <code>config.toml</code> 的顶层 provider；不会读取、复制、迁移或删除任何会话、认证或备份文件。切换后请关闭并重新打开所有 Codex 应用。</div>
    </aside>

    <footer>
      <p id="message" aria-live="polite">正在读取本机配置…</p>
      <button class="quiet-button" type="button" id="close-panel">关闭本地面板</button>
    </footer>
  </main>

  <script>
    (() => {
      const token = window.location.hash.slice(1);
      const modes = [...document.querySelectorAll("[data-mode]")];
      const message = document.querySelector("#message");

      function setMessage(text, kind = "") {
        message.textContent = text;
        message.className = kind;
      }

      function setBusy(busy) {
        modes.forEach((button) => { button.disabled = busy; });
      }

      async function api(path, options = {}) {
        if (!token) throw new Error("缺少本地访问令牌。请关闭此页面并从启动器重新打开。");
        const response = await fetch(path, {
          cache: "no-store",
          ...options,
          headers: {
            "X-Codex-Mode-Token": token,
            ...(options.headers || {})
          }
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || "本地面板请求失败。");
        return payload;
      }

      function displayStatus(status) {
        document.querySelector("#provider").textContent = status.provider || "OpenAI default";
        document.querySelector("#model").textContent = status.model || "automatic";
        document.querySelector("#home").textContent = status.codexHome || "—";
      }

      async function refresh() {
        const status = await api("/api/status");
        displayStatus(status);
      }

      async function switchMode(button) {
        const mode = button.dataset.mode;
        const name = button.dataset.name;
        if (!window.confirm(`切换到 ${name}？\n\n只会修改 config.toml 的顶层 provider，不会处理会话数据。`)) return;
        setBusy(true);
        setMessage(`正在切换到 ${name}…`);
        try {
          const result = await api("/api/switch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mode })
          });
          displayStatus(result.status);
          setMessage(`已切换到 ${name}。请关闭并重新打开所有 Codex 应用。`, "success");
        } catch (error) {
          setMessage(error.message, "error");
        } finally {
          setBusy(false);
        }
      }

      modes.forEach((button) => button.addEventListener("click", () => switchMode(button)));
      document.querySelector("#close-panel").addEventListener("click", async () => {
        try {
          await api("/api/close", { method: "POST" });
          setBusy(true);
          setMessage("本地面板已关闭。现在可以关闭此浏览器标签页。", "success");
        } catch (error) {
          setMessage(error.message, "error");
        }
      });

      refresh().then(() => setMessage("请选择需要的模式。", "success")).catch((error) => setMessage(error.message, "error"));
    })();
  </script>
</body>
</html>
